# Gateway collector — does the heavy processing: tail sampling, attribute
# scrubbing, fan-out to Jaeger / Prometheus / Loki. Single instance only (see the
# sampling-correctness boundary note in ITER_04 §04: multi-gateway needs the
# loadbalancing exporter for trace-ID-aware routing).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  tail_sampling:
    # decision_wait MUST exceed full end-to-end trace time incl. PREP_SECONDS (2s).
    decision_wait: 15s
    num_traces: 50000
    policies:
      - name: errors
        type: status_code
        status_code: {status_codes: [ERROR]}
      - name: slow
        type: latency
        latency: {threshold_ms: 800}
      - name: sample-rest
        type: probabilistic
        probabilistic: {sampling_percentage: 5}

  attributes/scrub:
    actions:
      # Cost-trim genuinely noisy, low-value attributes — NOT brewline.order_id,
      # which ITER_03 keeps on spans for the Loki->Jaeger pivot.
      - {key: http.request.header.user_agent, action: delete}
      - {key: net.sock.peer.addr, action: delete}

  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true   # promote service.name etc. to metric labels
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, attributes/scrub, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
