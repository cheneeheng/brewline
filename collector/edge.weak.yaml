# Deliberately UNDERSIZED edge config for ITER_04 experiment #3 (backpressure).
# Tiny memory_limiter, no batch processor. Run the k6 ramping-arrival-rate spike
# against this to watch otelcol_processor_refused_spans /
# otelcol_exporter_send_failed_spans rise and gaps appear in Jaeger.
# Swap back to edge.yaml to recover. DO NOT use this in normal operation.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 20
    spike_limit_mib: 5

exporters:
  otlp/gateway:
    endpoint: gateway-collector:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp/gateway]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp/gateway]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp/gateway]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
